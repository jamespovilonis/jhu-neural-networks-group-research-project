[project]
name = "jhu-wildfire-research"
version = "0.1.0"
description = "Research on Brazilian fire hotspots"
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface-hub>=0.30,<2",
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<25",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "threadpoolctl>=3.5,<4",
    "tqdm>=4.67,<5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]